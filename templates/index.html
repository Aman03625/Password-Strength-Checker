<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

     <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <h1>
            <i class="fa-solid fa-lock"></i>
            Password Strength Checker
        </h1>

        <label for="password">Enter Password</label>

        <div class="password-box">

            <input type="password"
                id="password"
                placeholder="Enter Password">
                <i class="fa-solid fa-copy" id="copyPassword"></i>

            <i class="fa-solid fa-eye"
                id="togglePassword"></i>

        </div>

        <h3>Strength</h3>

        <div class="progress">

            <div class="progress-bar"
                id="progressBar"></div>

        </div>

        <p class="strength-text"
            id="strengthText">
            Weak
        </p>

        <hr>
        

<h3>Password Analysis</h3>

<p>
    <strong>Entropy:</strong>
    <span id="entropy">0 bits</span>
</p>

<p>
    <strong>Estimated Crack Time:</strong>
    <span id="crackTime">Instantly</span>
</p>

<hr>


        <div class="rules">

            <p  id="lengthRule">❌ At least 8 Characters</p>

            <p id="upperRule">❌ Uppercase Letter</p>

            <p id="lowerRule">❌ Lowercase Letter</p>

            <p id="numberRule">❌ Number</p>

            <p id="specialRule">❌ Special Character</p>

        </div>

        <hr>
        <h3>Password Length</h3>

<input
type="range"
id="lengthSlider"
min="8"
max="20"
value="12">

<p class="slider-text">
Length :
<span id="lengthValue">12</span>
</p>

<hr>

<div class="options">

<label>
<input type="checkbox"
id="upperCheck"
checked>

Uppercase
</label>

<label>
<input type="checkbox"
id="lowerCheck"
checked>

Lowercase
</label>

<label>
<input type="checkbox"
id="numberCheck"
checked>

Numbers
</label>

<label>
<input type="checkbox"
id="symbolCheck"
checked>

Symbols
</label>

</div>

<hr>


        <button id="generateBtn">

            <i class="fa-solid fa-key"></i>

            Generate Strong Password

        </button>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
